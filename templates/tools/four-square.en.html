<section class="tool" id="online" aria-labelledby="online-title"
         data-tool="four-square"
         data-msg-mode="Invalid letter-omission mode."
         data-msg-copied="Copied">
  <h2 id="online-title">Four-square cipher online</h2>
  <div class="tool__grid">
    <div>
      <div class="field">
        <label for="fs-keyword1">Keyword for upper-right table</label>
        <input type="text" id="fs-keyword1" data-role="keyword1" value="example" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="fs-keyword2">Keyword for lower-left table</label>
        <input type="text" id="fs-keyword2" data-role="keyword2" value="keyword" autocomplete="off" spellcheck="false">
      </div>
      <fieldset>
        <legend>Letter left out of the tables</legend>
        <div class="options">
          <label><input type="radio" name="mode" value="j-as-i"> J as I</label>
          <label><input type="radio" name="mode" value="no-q" checked> Without Q</label>
          <label><input type="radio" name="mode" value="no-x"> Without X</label>
        </div>
      </fieldset>
    </div>
    <figure class="matrix-quad" aria-label="The four key tables">
      <table class="matrix" data-role="table-ul" aria-label="Upper-left (plain)"></table>
      <table class="matrix" data-role="table-ur" aria-label="Upper-right (keyword 1)"></table>
      <table class="matrix" data-role="table-ll" aria-label="Lower-left (keyword 2)"></table>
      <table class="matrix" data-role="table-lr" aria-label="Lower-right (plain)"></table>
    </figure>
  </div>

  <fieldset>
    <legend class="visually-hidden">Direction</legend>
    <div class="segmented">
      <label><input type="radio" name="direction" value="encrypt" checked> Encrypt</label>
      <label><input type="radio" name="direction" value="decrypt"> Decrypt</label>
    </div>
  </fieldset>

  <div class="field">
    <label for="fs-input">Text</label>
    <textarea id="fs-input" data-role="input" spellcheck="false">help me obi wan kenobi</textarea>
    <small>Only letters are used; spaces, digits and punctuation are ignored, accents are removed.</small>
  </div>

  <p class="tool__steps">Pairs: <span data-role="digraphs" aria-live="polite"></span></p>
  <p class="tool__error" data-role="error" role="alert"></p>

  <div class="field">
    <label for="fs-output">Result</label>
    <textarea id="fs-output" data-role="output" readonly></textarea>
  </div>
  <div class="tool__actions">
    <button type="button" class="button" data-role="copy">Copy result</button>
    <button type="button" class="button" data-role="swap">Use result as input</button>
  </div>
</section>
